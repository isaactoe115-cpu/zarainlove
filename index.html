<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surat Kecil Untuknya 💙</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
:root {
        --navy-dark: #0f172a;
        --navy-primary: #1e3a8a;
        --blue-light: #bae6fd;
        --blue-soft: #e0f2fe;
        --gray-light: #f1f5f9;
    }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--gray-light) 0%, var(--blue-soft) 50%, #dbeafe 100%);
            color: var(--navy-dark);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            border: 2px solid var(--blue-light);
            border-radius: 24px;
            padding: 25px 20px;
            box-shadow: 0 15px 35px rgba(30, 58, 138, 0.15);
            text-align: center;
        }

        h1 {
            font-family: 'Caveat', cursive;
            font-size: 2.8rem;
            color: var(--navy-primary);
            margin-bottom: 5px;
        }

        p {
            color: #475569;
            font-size: 0.9rem;
            margin-bottom: 15px;
        }

        /* Container Video & Aspect Ratio */
        .video-wrapper {
            position: relative;
            width: 100%;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(15, 23, 42, 0.25);
            border: 3px solid var(--navy-primary);
            background-color: #000;
        }

        video {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Tombol Play Besar opsional */
        .play-btn {
            margin-top: 15px;
            background: var(--navy-primary);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(30, 58, 138, 0.3);
            transition: all 0.3s ease;
        }

        .play-btn:hover {
            background: var(--navy-dark);
            transform: scale(1.05);
        }

        footer {
            margin-top: 20px;
            font-size: 0.8rem;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Surat Kecil Untuknya 💙</h1>
        <p>
            Klik tombol di bawah jika video tidak otomatis jalan.
        </p>

        <!-- Pemutar Video HTML5 -->
        <div class="video-wrapper">
            <video id="myVideo" controls playsinline preload="metadata">
                <!-- Nama file disederhanakan menjadi video.mp4 -->
                <source src="video.mp4" type="video/mp4">
                Browser Anda tidak mendukung pemutaran video.
            </video>
        </div>

        <button class="play-btn" onclick="playVideo()">Putar Video 🎬</button>

        <footer>
            Dibuat dengan ❤️ | Tema Navy, Biru Muda & Abu-abu
        </footer>
    </div>

    <script>
        function playVideo() {
            const video = document.getElementById('myVideo');
            if (video.paused) {
                video.play();
            } else {
                video.pause();
            }
        }
    </script>
</body>
</html>
