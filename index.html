<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spesial Untukmu 💙</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root {
--navy-dark: #0f172a;
--navy-primary: #1e3a8a;
--navy-soft: #2563eb;
--blue-light: #bae6fd;
--blue-soft: #e0f2fe;
--gray-light: #f1f5f9;
--gray-card: #e2e8f0;
}

* {
box-sizing: border-box;
margin: 0;
padding: 0;
}

body {
font-family: 'Poppins', sans-serif;
background: linear-gradient(135deg, var(--gray-light) 0%, var(--blue-soft) 50%, #dbeafe 100%);
color: var(--navy-dark);
min-height: 100vh;
display: flex;
justify-content: center;
align-items: center;
overflow-x: hidden;
position: relative;
padding: 20px;
}

/* Container Card Utama */
.container {
width: 100%;
max-width: 650px;
background: rgba(255, 255, 255, 0.85);
backdrop-filter: blur(16px);
border: 2px solid var(--blue-light);
border-radius: 24px;
padding: 40px 30px;
box-shadow: 0 15px 35px rgba(30, 58, 138, 0.15);
text-align: center;
position: relative;
z-index: 10;
}

h1 {
font-family: 'Caveat', cursive;
font-size: 3.2rem;
color: var(--navy-primary);
margin-bottom: 10px;
text-shadow: 1px 1px 2px rgba(0,0,0,0.05);
}

p.description {
color: #475569;
font-size: 1rem;
margin-bottom: 30px;
}

/* Tombol Interaktif */
.btn-container {
display: flex;
gap: 15px;
justify-content: center;
flex-wrap: wrap;
margin-bottom: 30px;
}

.btn {
background: linear-gradient(135deg, var(--navy-primary), var(--navy-soft));
color: #ffffff;
border: none;
padding: 14px 28px;
font-size: 1rem;
font-weight: 600;
border-radius: 50px;
cursor: pointer;
box-shadow: 0 4px 15px rgba(30, 58, 138, 0.3);
transition: all 0.3s ease;
display: inline-flex;
align-items: center;
gap: 8px;
}

.btn:hover {
transform: translateY(-3px) scale(1.03);
box-shadow: 0 8px 25px rgba(30, 58, 138, 0.4);
background: linear-gradient(135deg, var(--navy-dark), var(--navy-primary));
}

.btn:active {
transform: translateY(0);
}

/* Container Buket Bunga Lily */
.bouquet-card {
background: var(--gray-light);
border: 2px dashed var(--navy-soft);
border-radius: 20px;
padding: 30px 20px;
margin-top: 10px;
display: none;
flex-direction: column;
align-items: center;
animation: fadeIn 0.8s ease forwards;
}

@keyframes fadeIn {
from { opacity: 0; transform: translateY(15px); }
to { opacity: 1; transform: translateY(0); }
}

.bouquet-title {
font-family: 'Caveat', cursive;
font-size: 2.2rem;
color: var(--navy-primary);
margin-bottom: 20px;
}

/* Buket Bunga Lily Putih + Sampul Navy (SVG Canvas Vector) */
.bouquet-svg {
width: 220px;
height: auto;
filter: drop-shadow(0 10px 15px rgba(15, 23, 42, 0.2));
animation: floatBouquet 4s ease-in-out infinite alternate;
}

@keyframes floatBouquet {
0% { transform: translateY(0) rotate(0deg); }
100% { transform: translateY(-8px) rotate(2deg); }
}

/* Animasi Hujan Love */
.falling-heart {
position: fixed;
top: -50px;
user-select: none;
pointer-events: none;
z-index: 100;
animation: fall linear forwards;
}

@keyframes fall {
0% {
transform: translateY(0) rotate(0deg);
opacity: 1;
}
100% {
transform: translateY(105vh) rotate(360deg);
opacity: 0.2;
}
}

footer {
margin-top: 25px;
font-size: 0.85rem;
color: #64748b;
}
</style>
</head>
<body>

<div class="container">
<h1>Ada Pesan Untukmu 💙</h1>
<p class="description">Klik tombol di bawah ini untuk melihat kejutannya!</p>

<!-- Tombol Interaktif -->
<div class="btn-container">
<button class="btn" onclick="startNavyHeartRain()">
💙 Sayang
</button>
<button class="btn" onclick="toggleBouquet()">
🎁 Hadiah Kecil
</button>
</div>

<!-- Tampilan Buket Bunga Lily Putih dengan Sampul Navy -->
<div class="bouquet-card" id="bouquetCard">
<div class="bouquet-title">Buket Bunga Lily Putih Untukmu 💐</div>

<svg class="bouquet-svg" viewBox="0 0 300 400" xmlns="http://www.w3.org/2000/svg">
<!-- Daun-daun Hijau Tua -->
<path d="M120 180 Q80 130 60 160 Q100 200 130 200 Z" fill="#1e40af" opacity="0.4"/>
<path d="M180 180 Q220 130 240 160 Q200 200 170 200 Z" fill="#1e40af" opacity="0.4"/>
<path d="M150 160 Q100 90 90 120 Q130 150 150 180 Z" fill="#047857"/>
<path d="M150 160 Q200 90 210 120 Q170 150 150 180 Z" fill="#047857"/>

<!-- Bunga Lily Putih 1 (Tengah Atas) -->
<g transform="translate(150, 110)">
<!-- Kelopak Bunga Lily Putih -->
<path d="M0 0 Q-25 -50 0 -90 Q25 -50 0 0 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
<path d="M0 0 Q-60 -40 -80 -10 Q-30 10 0 0 Z" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
<path d="M0 0 Q60 -40 80 -10 Q30 10 0 0 Z" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
<path d="M0 0 Q-45 30 -60 50 Q-10 30 0 0 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
<path d="M0 0 Q45 30 60 50 Q10 30 0 0 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
<!-- Putik Bunga Kuning Mas -->
<circle cx="0" cy="-20" r="4" fill="#f59e0b"/>
<circle cx="-15" cy="-15" r="3.5" fill="#f59e0b"/>
<circle cx="15" cy="-15" r="3.5" fill="#f59e0b"/>
<line x1="0" y1="0" x2="0" y2="-20" stroke="#10b981" stroke-width="2"/>
<line x1="0" y1="0" x2="-15" y2="-15" stroke="#10b981" stroke-width="1.5"/>
<line x1="0" y1="0" x2="15" y2="-15" stroke="#10b981" stroke-width="1.5"/>
</g>

<!-- Bunga Lily Putih 2 (Kiri) -->
<g transform="translate(100, 150) rotate(-20)">
<path d="M0 0 Q-20 -40 0 -70 Q20 -40 0 0 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<path d="M0 0 Q-50 -30 -65 -5 Q-25 10 0 0 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<path d="M0 0 Q50 -30 65 -5 Q25 10 0 0 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<circle cx="0" cy="-15" r="3" fill="#f59e0b"/>
<line x1="0" y1="0" x2="0" y2="-15" stroke="#10b981" stroke-width="1.5"/>
</g>

<!-- Bunga Lily Putih 3 (Kanan) -->
<g transform="translate(200, 150) rotate(20)">
<path d="M0 0 Q-20 -40 0 -70 Q20 -40 0 0 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<path d="M0 0 Q-50 -30 -65 -5 Q-25 10 0 0 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<path d="M0 0 Q50 -30 65 -5 Q25 10 0 0 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<circle cx="0" cy="-15" r="3" fill="#f59e0b"/>
<line x1="0" y1="0" x2="0" y2="-15" stroke="#10b981" stroke-width="1.5"/>
</g>

<!-- Sampul Buket Bunga Warna Navy Blue (Kertas Pembungkus) -->
<!-- Lapisan Dalam Pembungkus -->
<polygon points="60,200 240,200 200,370 100,370" fill="#1e3a8a"/>
<!-- Lapisan Utama Sampul Navy Dark -->
<polygon points="40,190 260,190 190,380 110,380" fill="#0f172a"/>
<!-- Lipatan Kertas Pembungkus Navy -->
<polygon points="40,190 150,250 110,380" fill="#1e3a8a" opacity="0.6"/>
<polygon points="260,190 150,250 190,380" fill="#1e40af" opacity="0.8"/>

<!-- Pita Biru Muda / Light Blue Ribbon -->
<rect x="125" y="275" width="50" height="16" rx="5" fill="#bae6fd"/>
<!-- Ekstensi Pita -->
<path d="M135 291 L120 340 L140 335 L145 291 Z" fill="#93c5fd"/>
<path d="M165 291 L180 340 L160 335 L155 291 Z" fill="#93c5fd"/>
</svg>
</div>

<footer>
</footer>
</div>

<script>
// Fungsi Hujan Animasi Love Biru & Navy
function startNavyHeartRain() {
// Karakter Simbol Love Berwarna Biru & Navy
const heartIcons = ['💙', '🟦', '🔹', '💙', '💠'];

for (let i = 0; i < 35; i++) {
setTimeout(() => {
const heart = document.createElement('div');
heart.classList.add('falling-heart');

// Memilih simbol love secara acak
heart.innerText = heartIcons[Math.floor(Math.random() * heartIcons.length)];

// Ukuran, Posisi, dan Kecepatan Acak
const size = Math.random() * 20 + 15;
const leftPos = Math.random() * 100;
const duration = Math.random() * 3 + 2.5;

heart.style.left = leftPos + 'vw';
heart.style.fontSize = size + 'px';
heart.style.animationDuration = duration + 's';

document.body.appendChild(heart);

// Hapus elemen dari dom setelah animasi selesai
setTimeout(() => {
heart.remove();
}, duration * 1000);
}, i * 100);
}
}

// Fungsi Memunculkan/Menyembunyikan Buket Bunga Lily
function toggleBouquet() {
const card = document.getElementById('bouquetCard');
if (card.style.display === 'none' || card.style.display === '') {
card.style.display = 'flex';
card.scrollIntoView({ behavior: 'smooth' });
} else {
card.style.display = 'none';
}
}
</script>
</body>
</html>
